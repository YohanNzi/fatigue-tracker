services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fatiguetracker}
      POSTGRES_USER: ${POSTGRES_USER:-fatiguetracker}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fatiguetracker}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - fatiguetracker-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fatiguetracker} -d ${POSTGRES_DB:-fatiguetracker}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # MongoDB (J5.5) : store des relevés bruts (append-only, schéma flexible).
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - fatiguetracker-mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 10

  # API (J4) : image construite depuis le Dockerfile multi-stage local. Optionnelle pour
  # le dev au quotidien (./mvnw spring-boot:run reste plus rapide en boucle courte), utile
  # pour valider l'image packagée ou faire tourner l'ensemble sans JDK/Maven installés.
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-fatiguetracker}
      POSTGRES_USER: ${POSTGRES_USER:-fatiguetracker}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fatiguetracker}
      MONGODB_URI: mongodb://mongo:27017/fatiguetracker
      # JWT_SECRET n'est PAS défini ici volontairement : un `${JWT_SECRET:-}` non résolu
      # injecterait une chaîne vide dans le conteneur (variable présente mais vide), ce qui
      # ferait échouer JwtProperties ("security.jwt.secret est requis") au lieu de laisser
      # application.yml appliquer son propre default "dev only" — celui-ci ne s'applique que
      # lorsque la variable d'env est absente, pas lorsqu'elle vaut "". Pour surcharger le
      # secret (obligatoire en dehors d'un poste de dev local, voir README section Sécurité) :
      # exporter JWT_SECRET dans le shell avant `docker-compose up`, ou l'ajouter ici en dur.
      JWT_EXPIRATION_MINUTES: ${JWT_EXPIRATION_MINUTES:-60}
    ports:
      - "${APP_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  fatiguetracker-postgres-data:
  fatiguetracker-mongo-data:
