<header class="app-header">
  <mat-toolbar color="primary" class="app-toolbar">
    <a routerLink="/fleet" class="brand" aria-label="Accueil FatigueTracker">
      <span class="brand__mark"><mat-icon>flight</mat-icon></span>
      <span class="brand__text">
        <span class="brand__name">FatigueTracker</span>
        <span class="brand__tag">FLEET FATIGUE MONITORING</span>
      </span>
    </a>
    <span class="app-spacer"></span>

    @if (auth.isAuthenticated()) {
      <span class="app-user" [matTooltip]="'Connecté (' + auth.role() + ')'">
        <mat-icon>account_circle</mat-icon>
        <span class="app-user__name">{{ auth.username() }}</span>
        <span class="app-user__role">{{ auth.role() }}</span>
      </span>
      <button mat-button class="app-auth-btn" (click)="logout()">Déconnexion</button>
    } @else {
      <button mat-button class="app-auth-btn" (click)="openLogin()">
        <mat-icon>login</mat-icon> Connexion
      </button>
    }

    <button
      mat-icon-button
      class="theme-toggle"
      (click)="themeService.toggle()"
      [matTooltip]="themeService.theme() === 'dark' ? 'Passer en clair' : 'Passer en sombre'"
      [attr.aria-label]="themeService.theme() === 'dark' ? 'Passer en thème clair' : 'Passer en thème sombre'"
    >
      <mat-icon>{{ themeService.theme() === 'dark' ? 'light_mode' : 'dark_mode' }}</mat-icon>
    </button>
  </mat-toolbar>
  <!-- Ruban rouge : clin d'œil à la signature Air France (sans reprendre ses assets). -->
  <div class="app-ribbon" aria-hidden="true"></div>
</header>

<main class="app-main">
  <router-outlet></router-outlet>
</main>

<footer class="app-footer">
  <span>FatigueTracker — projet portfolio.</span>
  <span class="app-footer__muted">
    Design inspiré de la charte Air France · données et formule de fatigue illustratives.
  </span>
</footer>
