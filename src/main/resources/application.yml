spring:
  application:
    name: fatigue-tracker

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:fatiguetracker}
    driver-class-name: org.postgresql.Driver
    username: ${POSTGRES_USER:fatiguetracker}
    password: ${POSTGRES_PASSWORD:fatiguetracker}

  data:
    mongodb:
      # Stockage des relevés bruts (J5.5). Surchargé via MONGODB_URI (docker-compose,
      # prod). La persistance brute est best-effort : l'app démarre et ingère même si
      # Mongo est indisponible (voir FlightReadingService + management.health.mongo).
      uri: ${MONGODB_URI:mongodb://localhost:27017/fatiguetracker}
      # false : pas de connexion Mongo au démarrage (création d'index différée) → l'app
      # démarre même si Mongo est indisponible, cohérent avec l'archivage best-effort.
      # La connexion se fait à la première utilisation du store brut.
      auto-index-creation: false

  jpa:
    # Le schéma est possédé par Flyway (voir db/migration) : Hibernate ne fait
    # que valider qu'il correspond aux entités, jamais de DDL automatique.
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  batch:
    job:
      # Le job de recalcul de fatigue n'est jamais lancé automatiquement au
      # démarrage : uniquement à la demande via POST /api/fatigue/recompute.
      enabled: false
    jdbc:
      # Schéma de métadonnées Spring Batch fourni par Flyway (V2__batch_schema.sql),
      # Flyway reste la seule source de vérité du DDL (cf. ddl-auto: validate ci-dessus).
      initialize-schema: never

# Paramètres de la formule illustrative de calcul d'indice de fatigue (voir
# dev.ynzi.fatiguetracker.fatigue.FatigueCalculator et le README) — arbitraires,
# à ajuster librement, aucune donnée ni méthode propriétaire d'un employeur réel.
fatigue:
  reference-load-factor: 1.0
  exponent: 3.0
  normalization-factor: 1000.0
  alert-threshold: 80.0
  chunk-size: 20

# CORS (J5) : origins autorisés pour le front Angular servi séparément (ng serve).
# Liste séparée par des virgules, surchargeable via APP_CORS_ALLOWED_ORIGINS.
# Inutile si le front est servi par Spring (même origin) — cf. SecurityConfig.
app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:4200}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
  health:
    # Le store brut Mongo est auxiliaire et best-effort : son indisponibilité ne doit
    # pas faire basculer la santé (liveness) de l'application à DOWN.
    mongo:
      enabled: false

# JWT stateless (J3, voir dev.ynzi.fatiguetracker.security). "secret" DOIT être
# surchargé via la variable d'environnement JWT_SECRET en dehors d'un poste de dev
# local : la valeur ci-dessous est un default de DEV UNIQUEMENT, versionné donc
# public — ne jamais l'utiliser pour signer des tokens en environnement réel.
security:
  jwt:
    secret: ${JWT_SECRET:DWDtOJsFba/vEviEk1XcCn2rMDNq3VBkE3RX4gMQSl/oGPcbt4KSCnnCn0qOQ9jm}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:60}
