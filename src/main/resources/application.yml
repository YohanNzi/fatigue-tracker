spring:
  application:
    name: fatigue-tracker

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:fatiguetracker}
    driver-class-name: org.postgresql.Driver
    username: ${POSTGRES_USER:fatiguetracker}
    password: ${POSTGRES_PASSWORD:fatiguetracker}

  jpa:
    # Le schéma est possédé par Flyway (voir db/migration) : Hibernate ne fait
    # que valider qu'il correspond aux entités, jamais de DDL automatique.
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
